[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "organvm-schema-definitions"
version = "1.0.0"
description = "Canonical JSON Schema definitions for the organvm eight-organ system"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.8",
]

[project.scripts]
organvm-validate = "scripts.validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "schemas", "examples"]
namespaces = true

[tool.setuptools.package-data]
schemas = ["*.json"]
examples = [
    "*.json",
    "*.yaml",
    "*.yml",
    "project-record-v1-fixture/docs/audiences/*.md",
    "project-record-v1-fixture/docs/evidence/*.md",
    "project-record-v1-fixture/docs/evidence/claims/*.json",
    "project-record-v1-fixture/docs/evidence/sources/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
