name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check scripts/ tests/
      - name: Type check with pyright
        run: pyright scripts/
      - run: pytest tests/ -v
      - run: python scripts/validate.py --all-examples --actual-repository "${{ github.repository }}"
      - name: Build and smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          smoke="$(mktemp -d)"
          python -m venv --system-site-packages "$smoke/venv"
          "$smoke/venv/bin/pip" install --no-deps dist/*.whl
          (
            cd "$smoke"
            "$smoke/venv/bin/organvm-validate" --all-examples --actual-repository "${{ github.repository }}"
          )
